# Manual only. Standard GitHub-hosted macOS runner (free for public repos);
# never a larger runner. Unsigned simulator build; nothing goes to Apple.
name: iOS build, tests and screenshots
on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Capture the 35 design frames (light, dark) and the AX3 set row"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          mkdir -p review-logs screenshots-review
          xcrun simctl list devicetypes | grep -i "iPhone 16" | tee review-logs/devicetypes.txt
          xcrun simctl list runtimes | tee review-logs/runtimes.txt
      - name: LiftCore unit tests
        working-directory: Packages/LiftKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../review-logs/liftcore-tests.log
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      - name: Build and UI-test (iPhone 16 simulator, unsigned)
        run: |
          set -o pipefail
          UDID=$(xcrun simctl create lift-ci "iPhone 16")
          echo "$UDID" > review-logs/sim-udid.txt
          xcodebuild -project Lift.xcodeproj -scheme Lift -configuration Debug \
            -destination "id=$UDID" -derivedDataPath build/dd \
            -resultBundlePath review-logs/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO test > review-logs/xcodebuild.log 2>&1 \
            || { grep -E "error:|failed|Failing|XCTAssert" review-logs/xcodebuild.log | sort -u | head -150; tail -60 review-logs/xcodebuild.log; exit 1; }
          grep -E "Test Suite|Executed|passed|failed" review-logs/xcodebuild.log | tail -30
          xcrun simctl delete "$UDID" || true
      - name: Screenshots
        if: ${{ !cancelled() && inputs.screenshots && hashFiles('build/dd/Build/Products/Debug-iphonesimulator/Lift.app/Info.plist') != '' }}
        run: scripts/screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Lift.app screenshots-review
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lift-review
          path: |
            screenshots-review/
            review-logs/
          if-no-files-found: ignore
