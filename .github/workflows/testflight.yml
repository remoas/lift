# Manual only (workflow_dispatch). Never pull_request / pull_request_target:
# the repo is public and this job holds the App Store Connect API key.
# Standard free GitHub-hosted macOS runner. Archives a Release build, signs it
# with automatic provisioning via the API key, and uploads it to TestFlight.
name: TestFlight (internal)
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion"
        required: true
        default: "1"
      icloud:
        description: "Include the iCloud (CloudKit) entitlement. Needs container iCloud.com.benspink.lift registered on the App ID; off = local-only build"
        type: boolean
        default: true
      upload:
        description: "Upload the IPA to App Store Connect (needs Ben's yes for this build). Off = archive + export only"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'remoas/lift' && github.actor == 'remoas'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26 (App Store Connect requires the iOS 26 SDK)
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app | grep -vi beta | sort -V | tail -1)
          [ -n "$XC" ] || { echo "No Xcode 26 on this runner"; exit 1; }
          sudo xcode-select -s "$XC"
          xcodebuild -version
          mkdir -p tf-logs
      - name: API key
        env:
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          printf %s "$ASC_KEY_P8_B64" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
      - name: Generate project
        run: |
          brew install xcodegen && xcodegen generate
          if [ "${{ inputs.icloud }}" != "true" ]; then
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.icloud-container-identifiers" App/Lift.entitlements || true
            /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.icloud-services" App/Lift.entitlements || true
            /usr/libexec/PlistBuddy -c "Delete :aps-environment" App/Lift.entitlements || true
          fi
          cp App/Lift.entitlements tf-logs/entitlements-requested.plist
      - name: Archive (Release, automatic signing)
        run: |
          set -o pipefail
          xcodebuild archive -project Lift.xcodeproj -scheme Lift -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Lift.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ inputs.build_number }}" MARKETING_VERSION=1.0 \
            > tf-logs/archive.log 2>&1 \
            || { grep -E "error:|warning: .*(sign|profile|entitle)" tf-logs/archive.log | sort -u | head -80; tail -40 tf-logs/archive.log; exit 1; }
          tail -5 tf-logs/archive.log
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/Lift.xcarchive/Products/Applications/Lift.app/Info.plist)
          echo "CFBundleVersion=$V"
          [ "$V" = "${{ inputs.build_number }}" ] || { echo "CFBundleVersion $V != ${{ inputs.build_number }}"; exit 1; }
          # The watch app ships inside the iPhone app, same version and build.
          W=$(find build/Lift.xcarchive/Products/Applications/Lift.app -maxdepth 3 -name LiftWatch.app -type d | head -1)
          [ -n "$W" ] || { echo "LiftWatch.app is not embedded in Lift.app"; exit 1; }
          echo "Watch app: $W" | tee tf-logs/watch.txt
          WV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$W/Info.plist")
          WS=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$W/Info.plist")
          WB=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$W/Info.plist")
          WC=$(/usr/libexec/PlistBuddy -c "Print :WKCompanionAppBundleIdentifier" "$W/Info.plist")
          echo "watch $WB $WS ($WV), companion $WC" | tee -a tf-logs/watch.txt
          [ "$WV" = "$V" ] && [ "$WS" = "1.0" ] && [ "$WB" = "com.benspink.lift.watchkitapp" ] && [ "$WC" = "com.benspink.lift" ] \
            || { echo "Watch app version, bundle ID or companion ID is wrong"; exit 1; }
          codesign -d --entitlements :- "$W" 2>/dev/null > tf-logs/watch-entitlements.plist || true
          # The rest Live Activity extension (com.benspink.lift.widgets), same version and build.
          X=build/Lift.xcarchive/Products/Applications/Lift.app/PlugIns/LiftWidgets.appex
          [ -d "$X" ] || { echo "LiftWidgets.appex is not embedded in Lift.app"; exit 1; }
          XV=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$X/Info.plist")
          XB=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$X/Info.plist")
          echo "widgets $XB ($XV)" | tee -a tf-logs/watch.txt
          [ "$XV" = "$V" ] && [ "$XB" = "com.benspink.lift.widgets" ] || { echo "Widget extension version or bundle ID is wrong"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSSupportsLiveActivities" build/Lift.xcarchive/Products/Applications/Lift.app/Info.plist | grep -q true \
            || { echo "NSSupportsLiveActivities missing"; exit 1; }
      - name: Export IPA (App Store Connect)
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Lift.xcarchive -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > tf-logs/export.log 2>&1 \
            || { grep -E "error" tf-logs/export.log | sort -u | head -60; tail -40 tf-logs/export.log; exit 1; }
          ls -la build/export
          codesign -d --entitlements :- build/export/../Lift.xcarchive/Products/Applications/Lift.app 2>/dev/null | tee tf-logs/archive-entitlements.plist >/dev/null || true
      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        run: |
          set -o pipefail
          xcrun altool --upload-app -f build/export/Lift.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee tf-logs/upload.log
          # altool can exit 0 on a rejected upload; fail unless it says it worked.
          grep -q "UPLOAD SUCCEEDED" tf-logs/upload.log
      - name: Wait for processing, add to Lift Internal
        if: ${{ inputs.upload }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 scripts/asc_add_to_group.py 6839677746 "${{ inputs.build_number }}" "Lift Internal" 45 2>&1 | tee tf-logs/group.log
      - name: Remove key
        if: always()
        run: rm -rf ~/.appstoreconnect
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testflight-logs
          path: tf-logs/
          if-no-files-found: ignore
