name: Lift
options:
  bundleIdPrefix: com.benspink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set locally; never committed
    CODE_SIGN_STYLE: Automatic
packages:
  LiftKit:
    path: Packages/LiftKit
targets:
  Lift:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/ExerciseMedia
        type: folder                # keeps stills/ and video/ paths in the bundle
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
      - sdk: HealthKit.framework
      - sdk: Charts.framework
    entitlements:
      path: App/Lift.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers: [iCloud.com.benspink.lift]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lift
        UILaunchScreen:
          UIColorName: bgCanvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSHealthShareUsageDescription: Lift reads nothing from Health; this lets it confirm workouts it saved.
        NSHealthUpdateUsageDescription: Lift saves each finished workout to Apple Health as Traditional Strength Training.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benspink.lift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
schemes:
  Lift:
    build:
      targets:
        Lift: all
    test:
      config: Debug
    run:
      config: Debug
