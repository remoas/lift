name: Lift
options:
  bundleIdPrefix: com.benspink
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""            # set locally; never committed
    CODE_SIGN_STYLE: Automatic
packages:
  LiftKit:
    path: Packages/LiftKit
targets:
  Lift:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/ExerciseMedia
        type: folder                # keeps stills/ and video/ paths in the bundle
        buildPhase: resources
    dependencies:
      - package: LiftKit
        product: LiftCore
      - sdk: HealthKit.framework
      - sdk: Charts.framework
      - sdk: WatchConnectivity.framework
      - target: LiftWatch
        embed: true
    entitlements:
      path: App/Lift.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers: [iCloud.com.benspink.lift]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Lift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: bgCanvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSHealthShareUsageDescription: Lift reads nothing from Health; this lets it confirm workouts it saved.
        NSHealthUpdateUsageDescription: Lift saves each finished workout to Apple Health as Traditional Strength Training.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benspink.lift
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
  LiftWatch:
    # Single-target watchOS app, embedded in the iPhone app. Talks to the
    # phone over WatchConnectivity; the phone's SwiftData store is the database.
    type: application
    platform: watchOS
    sources:
      - path: Watch/Sources
      - path: Watch/Resources/Assets.xcassets
    dependencies:
      - package: LiftKit
        product: LiftCore
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework
      - sdk: CoreMotion.framework
    entitlements:
      path: Watch/LiftWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Lift
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.benspink.lift
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Lift shows your heart rate during a workout on your watch.
        NSHealthUpdateUsageDescription: Lift saves each workout you run on your watch to Apple Health as Traditional Strength Training.
        NSMotionUsageDescription: Lift counts reps from your wrist's movement while a set is running. You can always correct the count.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benspink.lift.watchkitapp
        PRODUCT_NAME: LiftWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
  LiftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: Lift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benspink.lift.uitests
        TEST_TARGET_NAME: Lift
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Lift:
    build:
      targets:
        Lift: all
        LiftUITests: [test]
    test:
      config: Debug
      targets: [LiftUITests]
    run:
      config: Debug
  LiftWatch:
    build:
      targets:
        LiftWatch: all
    run:
      config: Debug
